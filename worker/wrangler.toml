name = "pm-gym-grader"
main = "src/index.js"
compatibility_date = "2024-09-02"

[vars]
ENVIRONMENT = "development"
# Maximum grading REQUESTS per UTC day across all users, enforced by the GlobalBudget Durable Object.
# This is a request count, not a euro amount. Worst-case daily spend is roughly
# GLOBAL_DAILY_CAP x (maximum cost of one grading request, including any retries).
# Keep this conservative until real per-request model costs have been measured.
GLOBAL_DAILY_CAP = "20"

# Per-client counters (approximate). Replace the id with a real namespace id before any deploy.
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "REPLACE_WITH_REAL_KV_NAMESPACE_ID_BEFORE_DEPLOY"

[[durable_objects.bindings]]
name = "GLOBAL_BUDGET"
class_name = "GlobalBudget"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GlobalBudget"]

# Adapter selection and secrets are DELIBERATELY not set here as defaults.
# Without a trusted source of truth for LLM_PROVIDER, the Worker returns 503. This keeps a
# bare `wrangler deploy` from silently running mock in production.
#
# Local development:
#   cp .dev.vars.example .dev.vars    # LLM_PROVIDER=mock is set there
#
# Production deployment: use the [env.production] section below.

# ─── Production environment ────────────────────────────────────────────────────
# Deploy with: wrangler deploy --env production
# Bindings do NOT inherit from the top level — every binding must be redeclared here.

[env.production]
name = "pm-gym-grader-production"

[env.production.vars]
ENVIRONMENT = "production"
LLM_PROVIDER = "anthropic"
GLOBAL_DAILY_CAP = "20"

[[env.production.kv_namespaces]]
binding = "RATE_LIMIT_KV"
# Created with `wrangler kv namespace create RATE_LIMIT_KV --env production`.
# Not a secret — public identifier for the namespace within this Cloudflare account.
id = "ce2ff6ba6f984319901f764031d86d3b"

[[env.production.durable_objects.bindings]]
name = "GLOBAL_BUDGET"
class_name = "GlobalBudget"

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["GlobalBudget"]
